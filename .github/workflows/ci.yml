name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      QDRANT_URL: ""
      QDRANT_API_KEY: ""
      MONGODB_URL: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt vulture

      - name: Test suite
        run: python -m pytest -q

      - name: Dead-code gate (app)
        # Route handlers and Pydantic/settings fields are called by FastAPI
        # decorators/attribute access vulture cannot trace; exclude those
        # paths rather than lowering the bar project-wide.
        run: |
          vulture app/ --min-confidence 80 \
            --exclude "app/api/,app/schemas/,app/config/settings.py,app/config/constants.py"

      - name: No legacy models directory
        run: |
          if [ -d app/models ]; then
            echo "::error::app/models/ must not exist — domain/entities/ is the only home for entity definitions"
            exit 1
          fi
          if grep -rn "from app.models\|from app\.models" app/ tests/; then
            echo "::error::imports from app.models are forbidden"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Dead exports gate
        run: npx ts-prune --exit-code 1

      - name: Redirect test
        run: npx vitest run
