version: "3.9"

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: proposalcraft
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
      - qdrant
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: proposalcraft
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
      - qdrant
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: proposalcraft
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
    env_file:
      - .env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info

volumes:
  mongo_data:
  qdrant_data:
